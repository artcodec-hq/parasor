name: release

on:
  # Before pushing a release tag, run workflow_dispatch with dry_run=true on the
  # exact commit you plan to tag. Tags snapshot this workflow file too.
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip publishing"
        type: boolean
        default: true

jobs:
  build:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: latest
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  package:
    name: assemble dist tarball
    needs: build
    runs-on: ubuntu-22.04
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: latest
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.0-dev.$(date +%Y%m%d%H%M%S)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='$VERSION';fs.writeFileSync('package.json', JSON.stringify(p,null,2));"
      - run: pnpm build
      - run: node scripts/package.mjs
      - id: pack
        run: |
          cd dist
          TARBALL=$(npm pack --silent)
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: dist/*.tgz
          if-no-files-found: error

  verify-publish:
    name: verify npm publish dry-run
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tarball
          path: dist
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: |
          TARBALL="./dist/${{ needs.package.outputs.tarball }}"
          test -f "$TARBALL"
          npm publish "$TARBALL" --access public --dry-run --provenance

  publish-npm:
    name: publish npm
    needs: [package, verify-publish]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || !inputs.dry_run)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tarball
          path: dist
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm publish "./dist/${{ needs.package.outputs.tarball }}" --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: github release
    needs: [publish-npm]
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: tarball
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
